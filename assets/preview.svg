<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT Outline preview</title>
  <desc id="desc">A browser preview showing a ChatGPT conversation with a subtle right-side outline rail and hover card.</desc>
  <defs>
    <linearGradient id="page" x1="140" y1="60" x2="1140" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F8FB"/>
      <stop offset="1" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="card" x1="820" y1="170" x2="1065" y2="585" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="softShadow" x="35" y="25" width="1210" height="710" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="42" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="765" y="120" width="380" height="540" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="760" fill="#E8EDF3"/>
  <rect x="70" y="58" width="1140" height="644" rx="30" fill="url(#page)" filter="url(#softShadow)"/>

  <rect x="70" y="58" width="1140" height="58" rx="30" fill="#FFFFFF"/>
  <rect x="70" y="91" width="1140" height="25" fill="#FFFFFF"/>
  <circle cx="104" cy="87" r="8" fill="#FF6B6B"/>
  <circle cx="130" cy="87" r="8" fill="#F7C948"/>
  <circle cx="156" cy="87" r="8" fill="#3CCF91"/>
  <rect x="206" y="74" width="420" height="26" rx="13" fill="#F2F4F7"/>
  <text x="224" y="92" fill="#667085" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">chatgpt.com/c/example</text>

  <rect x="96" y="132" width="208" height="546" rx="18" fill="#FFFFFF" opacity="0.78"/>
  <rect x="122" y="160" width="96" height="16" rx="8" fill="#111827" opacity="0.86"/>
  <rect x="122" y="204" width="132" height="12" rx="6" fill="#D0D5DD"/>
  <rect x="122" y="232" width="106" height="12" rx="6" fill="#D0D5DD"/>
  <rect x="122" y="260" width="148" height="12" rx="6" fill="#D0D5DD"/>
  <rect x="122" y="306" width="118" height="12" rx="6" fill="#D0D5DD"/>
  <rect x="122" y="334" width="138" height="12" rx="6" fill="#D0D5DD"/>
  <rect x="122" y="362" width="96" height="12" rx="6" fill="#D0D5DD"/>

  <rect x="358" y="156" width="458" height="62" rx="22" fill="#F5F6F8"/>
  <text x="388" y="194" fill="#344054" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Help me structure a long answer into sections</text>

  <rect x="358" y="256" width="546" height="346" rx="26" fill="#FFFFFF"/>
  <circle cx="398" cy="302" r="17" fill="#10A37F"/>
  <path d="M390 302.5L396.5 309L407 295.5" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="438" y="286" width="210" height="16" rx="8" fill="#101828"/>
  <rect x="438" y="323" width="390" height="12" rx="6" fill="#D0D5DD"/>
  <rect x="438" y="347" width="344" height="12" rx="6" fill="#D0D5DD"/>
  <rect x="438" y="386" width="172" height="14" rx="7" fill="#101828"/>
  <rect x="438" y="421" width="414" height="12" rx="6" fill="#D0D5DD"/>
  <rect x="438" y="445" width="356" height="12" rx="6" fill="#D0D5DD"/>
  <rect x="438" y="484" width="226" height="14" rx="7" fill="#101828"/>
  <rect x="438" y="519" width="398" height="12" rx="6" fill="#D0D5DD"/>
  <rect x="438" y="543" width="306" height="12" rx="6" fill="#D0D5DD"/>

  <g filter="url(#cardShadow)">
    <rect x="814" y="166" width="296" height="432" rx="24" fill="url(#card)" stroke="#E5E7EB"/>
    <text x="846" y="211" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="720">Assistant outline</text>
    <rect x="846" y="248" width="210" height="34" rx="8" fill="#EFF6FF"/>
    <text x="860" y="270" fill="#0B65D8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Project overview</text>
    <text x="870" y="318" fill="#667085" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Core workflow</text>
    <text x="870" y="361" fill="#667085" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Tradeoffs</text>
    <text x="870" y="404" fill="#667085" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Implementation notes</text>
    <text x="870" y="447" fill="#667085" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Next steps</text>
    <rect x="846" y="503" width="132" height="10" rx="5" fill="#E5E7EB"/>
    <rect x="846" y="526" width="178" height="10" rx="5" fill="#E5E7EB"/>
    <rect x="846" y="549" width="104" height="10" rx="5" fill="#E5E7EB"/>
  </g>

  <g>
    <rect x="1148" y="274" width="38" height="214" rx="19" fill="#FFFFFF" opacity="0.88"/>
    <rect x="1161" y="302" width="18" height="4" rx="2" fill="#111827"/>
    <rect x="1155" y="334" width="24" height="4" rx="2" fill="#D0D5DD"/>
    <rect x="1163" y="366" width="16" height="4" rx="2" fill="#D0D5DD"/>
    <rect x="1155" y="398" width="24" height="4" rx="2" fill="#D0D5DD"/>
    <rect x="1163" y="430" width="16" height="4" rx="2" fill="#D0D5DD"/>
    <rect x="1159" y="462" width="20" height="4" rx="2" fill="#D0D5DD"/>
  </g>

  <rect x="156" y="622" width="280" height="34" rx="17" fill="#111827"/>
  <text x="180" y="644" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Minimal rail, rich outline on hover</text>
